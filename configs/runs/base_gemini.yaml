# Base cho mọi run: LLM backbone, cache, tham số MemRec giống config upstream
seed: 42
provider:
  name: gemini
  model: gemini-3.5-flash-lite
cache_path: results/cache/gemini-3.5-flash-lite.sqlite   # dùng chung giữa các arm
max_physical_calls: 2500       # trần an toàn cho một run (~300 user x 5 lời gọi + dư)
workers: 16
warmup:
  enabled: true
splits: [test]

memrec:                         # = configs/memrec_instructrec-books.yaml (upstream)
  k: 16
  tau_tokens: 1800
  mix_min_users: 4
  mix_min_items: 6
  n_facets: 7
  temperature: 0.0
  max_tokens: 4000
  pruner:
    mode: llm_rules
  write:
    fanout_cap: 8
  vanilla_history_len: 10
